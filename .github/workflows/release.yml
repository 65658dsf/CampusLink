name: Desktop CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing main-reachable tag matching package.json (for example v1.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version and test on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.ref.outputs.release }}
      tag: ${{ steps.ref.outputs.tag }}
      sha: ${{ steps.ref.outputs.sha }}
      version: ${{ steps.ref.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate tag, version and main ancestry
        id: ref
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: node scripts/release/validate-ref.cjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.ref.outputs.sha }}
          persist-credentials: false
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - run: npm run build

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate
    if: needs.validate.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Windows desktop integration with a local mock server
        if: matrix.platform == 'win'
        run: npm run test:desktop
      - name: Package Windows without publishing
        if: matrix.platform == 'win'
        run: node scripts/release/build.cjs win x64
      - name: Verify Windows installer directory normalization
        if: matrix.platform == 'win'
        run: node --test scripts/release/installer-path.test.cjs
      - name: Package macOS without publishing
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release/build.cjs mac ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/build-${{ matrix.platform }}-${{ matrix.arch }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish all platform assets together
    needs: [validate, build]
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Revalidate tag immediately before release
        env:
          RELEASE_REVALIDATE_TAG: ${{ needs.validate.outputs.tag }}
        run: node scripts/release/validate-ref.cjs
      - name: Verify artifacts, create checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: node scripts/release/publish.cjs release-assets
